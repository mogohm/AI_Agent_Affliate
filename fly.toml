# Fly.io — cheapest setup: ONE machine runs the web app + inline job worker,
# with PGlite (embedded Postgres) on a persistent volume and files on Cloudflare R2.
# No Neon / Redis needed. Change `app` if the name is taken.
app = "ai-affiliate-studio"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATABASE_URL = "pglite:///data/pglite"
  # Files (MP4/images) go to Cloudflare R2. S3_ENDPOINT + keys are set with `fly secrets set`.
  STORAGE_DRIVER = "s3"
  S3_BUCKET = "ai-affiliate"
  S3_REGION = "auto"
  S3_FORCE_PATH_STYLE = "true"
  WORKER_INLINE = "true"
  QUEUE_DRIVER = "db"

[[mounts]]
  source = "aas_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Stops the machine when idle to save money. Jobs are durable in the DB:
  # an interrupted render is retried automatically on the next start.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
