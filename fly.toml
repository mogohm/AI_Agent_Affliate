# fly.toml app configuration file generated for ai-affiliate-studio on 2026-11-16T01:31:28+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ai-affiliate-studio'
primary_region = 'sin'
# Swap on the machine's disk: absorbs memory spikes (DB init, video render) instead of OOM-killing.
swap_size_mb = 1024

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'pglite:///data/pglite'
  NODE_ENV = 'production'
  QUEUE_DRIVER = 'db'
  S3_BUCKET = 'ai-affiliate'
  S3_FORCE_PATH_STYLE = 'true'
  S3_REGION = 'auto'
  STORAGE_DRIVER = 's3'
  WORKER_INLINE = 'true'

[[mounts]]
  source = 'aas_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the machine running: the job worker and automation scheduler live in this process,
  # so stopping on idle HTTP traffic would pause renders and scheduled automations.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
